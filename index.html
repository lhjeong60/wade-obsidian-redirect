<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>여는 중…</title>
<meta name="robots" content="noindex">
<style>
  body { font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center;
         justify-content: center; height: 100vh; margin: 0; color: #666; text-align: center; padding: 0 24px; }
  #msg { font-size: 48px; line-height: 1.4; }
  button { margin-top: 48px; padding: 30px 60px; font-size: 45px; border: 1px solid #ccc; border-radius: 24px;
           background: #f5f5f5; color: #333; display: none; }
</style>
</head>
<body>
<p id="msg">여는 중…</p>
<button id="closeBtn" onclick="window.close()">창 닫기</button>
<script>
  // 경로는 URL fragment(#)로만 받는다 — fragment는 브라우저가 서버로 절대 전송하지 않으므로
  // GitHub Pages 접근 로그에 실제 목적지(볼트 경로/파일명)가 남지 않는다.
  var target = decodeURIComponent(location.hash.slice(1));
  var msg = document.getElementById('msg');
  var closeBtn = document.getElementById('closeBtn');
  if (target && target.indexOf('obsidian://') === 0) {
    location.href = target;
    // 세션 히스토리가 1개(이 탭에서 이 페이지 말고 다른 데 이동한 적 없음)면 window.close()가
    // 허용된다 — 텔레그램이 링크를 새 탭/웹뷰로 여는 경우 대부분 해당. 성공하면 탭이 그냥
    // 닫히고 아래 코드는 실행 안 된다. 실패하는 환경(브라우저별 구현 차이)만 버튼으로 보완.
    setTimeout(function () {
      window.close();
      msg.textContent = '옵시디언이 열렸으면 이 창은 닫으셔도 됩니다.';
      closeBtn.style.display = 'inline-block';
    }, 800);
  } else {
    msg.textContent = '유효한 링크가 아닙니다.';
  }
</script>
</body>
</html>
